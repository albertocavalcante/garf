name: Build and Upload Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build binaries for (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  upload-binaries:
    name: Build and Upload Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Extract version from tag
        id: get_version
        run: |
          # Use the input tag if provided or the release tag
          # Use the input tag if provided or the release tag
          TAG_REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=${TAG_REF#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION from tag: $TAG_REF"
          echo "Using version: $VERSION from tag: $TAG_REF"

      - name: List available targets
        run: |
          # Check which targets are actually available
          echo "Available bazel targets:"
          bazelisk query 'kind("go_binary", //...)'
          echo "---------------------------------------"

      - name: Build and prepare binaries
        id: build
      - name: Build and prepare binaries
        id: build
        run: |
          set -x  # Enable debugging
          
          # Attempt to build all targets
          echo "Building cross-platform binaries..."
          bazelisk build //:garf-bin-linux-amd64 //:garf-bin-linux-arm64 //:garf-bin-darwin-amd64 //:garf-bin-darwin-arm64 //:garf-bin-windows-amd64 //:garf-bin-windows-arm64 || echo "Some targets may have failed to build"
          
          # Show what Bazel actually produced
          echo "Listing bazel-bin directory contents:"
          find bazel-bin -type f -name "garf-bin_*" | sort
          
          # Create release directory
          mkdir -p release-binaries
          
          # Copy binaries with proper naming
          found_binaries=0
          
          # Platforms to build for
          platforms=("linux:amd64" "linux:arm64" "darwin:amd64" "darwin:arm64" "windows:amd64" "windows:arm64")
          
          for platform in "${platforms[@]}"; do
            os=${platform%%:*}
            arch=${platform##*:}
            
            # Define possible source paths - Bazel can use different output patterns
            if [ "$os" == "windows" ]; then
              source_patterns=(
                "bazel-bin/garf-bin_${os}_${arch}.exe"
                "bazel-bin/${os}_${arch}-fastbuild/garf-bin_${os}_${arch}.exe"
                "bazel-out/${os}_${arch}-fastbuild/bin/garf-bin_${os}_${arch}.exe"
                "bazel-out/*-fastbuild/bin/garf-bin_${os}_${arch}.exe"
              )
              dst="release-binaries/garf-${VERSION}-${os}-${arch}.exe"
            else
              source_patterns=(
                "bazel-bin/garf-bin_${os}_${arch}"
                "bazel-bin/${os}_${arch}-fastbuild/garf-bin_${os}_${arch}"
                "bazel-out/${os}_${arch}-fastbuild/bin/garf-bin_${os}_${arch}"
                "bazel-out/*-fastbuild/bin/garf-bin_${os}_${arch}"
              )
              dst="release-binaries/garf-${VERSION}-${os}-${arch}"
            fi
            
            # Try to find the binary using different patterns
            binary_found=false
            for pattern in "${source_patterns[@]}"; do
              # Use find to locate the file
              found_files=$(find bazel-bin bazel-out -type f -path "${pattern}" 2>/dev/null)
              
              if [ -n "$found_files" ]; then
                # Take the first match if multiple are found
                src=$(echo "$found_files" | head -n 1)
                cp "$src" "$dst"
                echo "✓ ${os}/${arch}: Copied from $src to $(basename "$dst")"
                found_binaries=$((found_binaries+1))
                binary_found=true
                break
              fi
            done
            
            if [ "$binary_found" == "false" ]; then
              echo "✗ ${os}/${arch}: Binary not found with any of the expected patterns"
            fi
          done
          
          # Show what we found
          echo "Found $found_binaries binaries for release"
          ls -la release-binaries/
          
          # Continue even if we don't have all binaries
          # Just warn if we have none
          if [ "$found_binaries" -eq 0 ]; then
            echo "::warning::No binaries found to upload"
          fi
          
          # Set output for next step
          if [ "$found_binaries" -eq 0 ]; then
            echo "No binaries found to upload"
            exit 1
          fi

      - name: Upload binaries to release
        if: steps.build.outcome == 'success'
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count how many files we have to upload
          file_count=$(find release-binaries -type f | wc -l)
          
          if [ "$file_count" -eq 0 ]; then
            echo "No binaries to upload, skipping"
            exit 0
          fi
          
          # Target tag for upload
          # Target tag for upload
          TARGET_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          
          # Upload all binaries at once
          echo "Uploading $file_count binaries to release $TARGET_TAG"
          gh release upload "$TARGET_TAG" release-binaries/* --clobber
          # Upload all binaries at once
          echo "Uploading binaries to release $TARGET_TAG"
          gh release upload "$TARGET_TAG" release-binaries/* --clobber
