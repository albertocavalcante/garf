name: Build and Upload Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build binaries for (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  upload-binaries:
    name: Build and Upload Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Extract version from tag
        id: get_version
        run: |
          # Use the input tag if provided through workflow_dispatch or the GitHub ref
          TAG_REF="${{ github.event.inputs.tag || github.ref_name }}"
          # Extract version from the tag (remove the 'v' prefix if present)
          VERSION=${TAG_REF#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION from tag: $TAG_REF"

      - name: Build binaries for all platforms
        run: |
          # Build all cross-platform targets using bazelisk explicitly
          # This uses the targets created by cross_platform_go_binary in BUILD.bazel
          bazelisk build //:garf-linux-amd64 //:garf-linux-arm64 //:garf-darwin-amd64 //:garf-darwin-arm64 //:garf-windows-amd64 //:garf-windows-arm64

          # Create a directory for the binaries
          mkdir -p release-binaries

          # List all generated binaries to verify they exist
          find bazel-bin -name "garf-*-*" -type f -executable -o -name "garf-*-*.exe" | grep -v "\.runfiles" | sort

          # Copy binaries to the release directory with proper naming
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              if [ "$os" == "windows" ]; then
                # For Windows binaries
                src="bazel-bin/garf-${os}-${arch}.exe"
                if [ -f "$src" ]; then
                  cp "$src" "release-binaries/garf-${VERSION}-${os}-${arch}.exe"
                else
                  echo "Warning: Expected binary not found at $src"
                fi
              else
                # For Linux/Darwin binaries
                src="bazel-bin/garf-${os}-${arch}"
                if [ -f "$src" ]; then
                  cp "$src" "release-binaries/garf-${VERSION}-${os}-${arch}"
                else
                  echo "Warning: Expected binary not found at $src"
                fi
              fi
            done
          done

          # List files to be uploaded
          echo "Files to be uploaded:"
          ls -la release-binaries/

      - name: Upload binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the input tag if provided through workflow_dispatch or the GitHub ref name
          TARGET_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          
          # Upload each binary to the release
          for file in release-binaries/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file to release $TARGET_TAG"
              gh release upload "$TARGET_TAG" "$file"
            fi
          done
