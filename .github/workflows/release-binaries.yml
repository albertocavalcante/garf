name: Build and Upload Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build binaries for (e.g., v0.1.0)"
        required: true
        type: string

jobs:
  upload-binaries:
    name: Build and Upload Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Extract version from tag
        id: get_version
        run: |
          # Use the input tag if provided or the release tag
          TAG_REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=${TAG_REF#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION from tag: $TAG_REF"

      - name: List available targets
        run: |
          # Check which targets are actually available
          echo "Available bazel targets:"
          bazelisk query 'kind("go_binary", //...)'
          echo "---------------------------------------"
      - name: Build and prepare binaries
        id: build
        run: |
          # Build cross-platform binaries
          echo "Building cross-platform binaries..."
          bazelisk build //:garf-bin-linux-amd64 //:garf-bin-linux-arm64 //:garf-bin-darwin-amd64 //:garf-bin-darwin-arm64 //:garf-bin-windows-amd64 //:garf-bin-windows-arm64

          # Create release directory
          mkdir -p release-binaries

          # Find the actual binary locations by querying bazel
          echo "Locating binaries..."
          bazelisk build //:garf-bin-linux-amd64 --show_result=all

          # Direct copy approach - these paths match the Bazel output pattern
          # from the cross_platform_go_binary macro defined in private/go_binary.bzl
          cp -v $(bazelisk info bazel-bin)/garf-bin_linux_amd64 release-binaries/garf-${VERSION}-linux-amd64
          cp -v $(bazelisk info bazel-bin)/garf-bin_linux_arm64 release-binaries/garf-${VERSION}-linux-arm64
          cp -v $(bazelisk info bazel-bin)/garf-bin_darwin_amd64 release-binaries/garf-${VERSION}-darwin-amd64
          cp -v $(bazelisk info bazel-bin)/garf-bin_darwin_arm64 release-binaries/garf-${VERSION}-darwin-arm64
          cp -v $(bazelisk info bazel-bin)/garf-bin_windows_amd64.exe release-binaries/garf-${VERSION}-windows-amd64.exe
          cp -v $(bazelisk info bazel-bin)/garf-bin_windows_arm64.exe release-binaries/garf-${VERSION}-windows-arm64.exe

          # Count and show found binaries
          found_binaries=$(find release-binaries -type f | wc -l)
          echo "Found $found_binaries binaries for release:"
          ls -la release-binaries/

          # Fail if no binaries were found
          if [ "$found_binaries" -eq 0 ]; then
            echo "::warning::No binaries found to upload"
            exit 1
          fi

      - name: Upload binaries to release
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count how many files we have to upload
          file_count=$(find release-binaries -type f | wc -l)

          if [ "$file_count" -eq 0 ]; then
            echo "No binaries to upload, skipping"
            exit 0
          fi

          # Target tag for upload
          TARGET_TAG="${{ github.event.inputs.tag || github.ref_name }}"

          # Upload all binaries at once
          echo "Uploading $file_count binaries to release $TARGET_TAG"
          gh release upload "$TARGET_TAG" release-binaries/* --clobber
